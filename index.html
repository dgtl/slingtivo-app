<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SlingTiVo">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css?v=7">
  <title>SlingTiVo</title>
</head>
<body>
  <div id="app">
    <!-- VIDEO -->
    <section id="stage">
      <video id="video" playsinline webkit-playsinline></video>

      <div id="splash">
        <div class="logo">SLING<span>TiVo</span></div>
        <button id="watchBtn" class="big">▶ Watch</button>
        <div id="splashMsg"></div>
      </div>

      <div id="spinner" hidden></div>
      <div id="toast"></div>

      <!-- GESTURE LOCK -->
      <div id="lockOverlay">
        <div id="lockBtn">
          <svg id="lockRing" viewBox="0 0 140 140">
            <circle class="ring-track" cx="70" cy="70" r="60"/>
            <circle id="ringProgress" class="ring-fill" cx="70" cy="70" r="60"/>
          </svg>
          <div id="lockIcon">🔒</div>
        </div>
      </div>

      <div id="topbar">
        <button data-act="mute" id="muteBtn" aria-label="Mute">🔊</button>
        <button data-act="float" aria-label="Float video"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><rect x="12" y="11.5" width="7" height="5.5" rx="1" fill="currentColor"/></svg></button>
        <button data-act="reload" aria-label="Reload stream">⟳</button>
        <button data-act="remote" aria-label="Show remote"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="8" r="2.2"/><circle cx="10" cy="13.5" r=".6" fill="currentColor"/><circle cx="14" cy="13.5" r=".6" fill="currentColor"/><circle cx="10" cy="16.5" r=".6" fill="currentColor"/><circle cx="14" cy="16.5" r=".6" fill="currentColor"/><circle cx="12" cy="19" r=".6" fill="currentColor"/></svg></button>
        <button data-act="fullscreen" aria-label="Full screen">⛶</button>
      </div>

      <div id="gestureHint">Swipe ↑↓ channel · swipe ←→ last channel · tap for controls</div>
    </section>

    <!-- REMOTE HANDLE (swipe up or tap to show remote in portrait) -->
    <div id="remoteHandle" data-act="toggleRemote">
      <div class="handle-bar"></div>
    </div>

    <!-- REMOTE -->
    <section id="remote">
      <div class="row four">
        <button data-key="Guide">Guide</button>
        <button data-key="DVR" class="tivo">TiVo</button>
        <button data-key="Menu">Menu</button>
        <button data-key="Exit">Exit</button>
      </div>

      <div class="nav">
        <div class="col">
          <button data-key="Last" class="pill">Last</button>
          <button data-key="OnDemand" class="pill small">On Demand</button>
        </div>
        <div class="dpad">
          <button data-key="Up" class="up">▲</button>
          <button data-key="Left" class="left">◀</button>
          <button data-key="OK" class="ok">OK</button>
          <button data-key="Right" class="right">▶</button>
          <button data-key="Down" class="down">▼</button>
        </div>
        <div class="col rocker">
          <button data-key="Ch+">CH ＋</button>
          <button data-key="Ch-">CH −</button>
        </div>
      </div>

      <div class="row five transport">
        <button data-key="Rew">◀◀</button>
        <button data-key="Play">▶</button>
        <button data-key="Pause">❚❚</button>
        <button data-key="FF">▶▶</button>
        <button data-key="Rec" class="rec">●</button>
      </div>

      <div class="numpad">
        <div id="digits" class="digits">– – –</div>
        <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
        <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
        <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
        <button data-act="clear" class="dim">Clear</button><button data-num="0">0</button><button data-act="go" class="go">Go</button>
      </div>

      <div class="row four dim-row">
        <button data-key="Pg-">Page −</button>
        <button data-key="Pg+">Page ＋</button>
        <button data-key="Day-">Day −</button>
        <button data-key="Day+">Day ＋</button>
      </div>
      <div class="row one">
        <button data-key="Power" data-confirm="Send Power to the TiVo?" class="power">⏻ Power</button>
      </div>
    </section>
  </div>

  <script src="/hls.min.js?v=5"></script>
  <script src="/app.js?v=7"></script>
</body>
</html>
